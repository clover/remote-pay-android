apply from: file("${projectDir}/../versions.gradle")
apply plugin: 'com.android.library'

group = 'com.clover.sdk'
version = "${REMOTE_PAY_ANDROID_VERSION}"

android {
  lintOptions {
    abortOnError false
  }

  defaultConfig {
    minSdkVersion 17
    targetSdkVersion 19
    compileSdk COMPILE_SDK_VERSION
  }

  packagingOptions {
    exclude 'META-INF/NOTICE'
    exclude 'META-INF/LICENSE'
  }
}
defaultTasks 'install'
java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
  implementation "com.clover:clover-remote-interface:${CLOVER_COMMON_VERSION}"
  implementation "com.clover.sdk:clover-android-sdk:${CLOVER_SDK_VERSION}"
  implementation "com.google.code.gson:gson:${GSON_VERSION}"
  implementation "com.neovisionaries:nv-websocket-client:${NV_WEBSOCKET_CLIENT_VERSION}"
  testImplementation "junit:junit:${JUNIT_VERSION}"
}

apply plugin: 'signing'

tasks.register('sourcesJar', Jar) {
  archiveClassifier = 'sources'
  from android.sourceSets.main.java.srcDirs
}

artifacts {
    archives sourcesJar
}

tasks.register('javadoc', Javadoc) {

    doFirst {
        configurations.implementation
                .filter { it.name.endsWith('.aar') }
        .each { aar ->
            copy {
                from zipTree(aar)
                include "**/classes.jar"
                into "$buildDir/tmp/aarsToJars/${aar.name.replace('.aar', '')}/"
            }
        }
    }

    configurations.implementation.setCanBeResolved(true)
    title = "Android Clover Connector ${REMOTE_PAY_ANDROID_VERSION}"
    source = android.sourceSets.main.java.srcDirs
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    classpath += configurations.implementation
    classpath += fileTree(dir: "$buildDir/tmp/aarsToJars/")
    destinationDir = file("${rootDir}/javadoc/")
    failOnError false
    exclude '**/BuildConfig.java'
    exclude '**/R.java'
}
